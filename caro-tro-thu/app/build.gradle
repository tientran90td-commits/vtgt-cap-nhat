}

android {
    namespace 'com.caro.helper'
    compileSdk 34

    defaultConfig {
        applicationId 'com.caro.helper'
        minSdk 21
        targetSdk 34
        versionCode 6
        versionName '2.4'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
