name: TTube - Build APK

on:
  push:
    paths:
      - 'mytube/**'
      - '.github/workflows/mytube.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mytube-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mytube
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PbuildNumber=${{ github.run_number }} --stacktrace

      - name: Prepare APK
        id: apk
        run: |
          VERSION="2.2.0.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "TTube-$VERSION.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: TTube-${{ steps.apk.outputs.version }}
          path: mytube/TTube-${{ steps.apk.outputs.version }}.apk

      # Tag prefix "mytube-v" keeps these separate from the repo's other releases.
      # Marked prerelease and never "latest" so other apps' update checks are unaffected.
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mytube-v${{ steps.apk.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: TTube ${{ steps.apk.outputs.version }}
          files: mytube/TTube-${{ steps.apk.outputs.version }}.apk
          prerelease: true
          make_latest: false
          body: |
            TTube ${{ steps.apk.outputs.version }} — personal build based on YTXTube (GPL-3.0).
            Built from commit ${{ github.sha }}.
